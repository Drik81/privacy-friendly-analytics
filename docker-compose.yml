services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: privacy-friendly-analytics-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_password123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
volumes:
  sqlserver-data:
